{% extends 'recommender/base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">
          <h3 class="card-title text-center text-success mb-4">Login</h3>
          
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-danger border-0 shadow-sm mb-3">{{ message }}</div>
            {% endfor %}
          {% endif %}

          <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Email / Username</label>
              <input type="text" name="username" class="form-control" required placeholder="user@example.com">
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Sign In</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
